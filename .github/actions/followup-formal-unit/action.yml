name: Execute one frozen follow-up formal phase
description: Set up exact S1, run one producer or replay/guard, and upload its exact artifact.

inputs:
  expected-s1:
    required: true
  expected-s2:
    required: true
  expected-compatibility:
    required: true
  unit-ordinal:
    required: true
  expected-job-token:
    required: true
  phase:
    required: true
  producer-artifact-name:
    required: false
    default: ''
  acquisition-artifact-name:
    required: false
    default: ''
  native-build:
    required: false
    default: 'false'
  retention-days:
    required: true

outputs:
  artifact_name:
    value: ${{ steps.run.outputs.artifact_name }}

runs:
  using: composite
  steps:
    - name: Verify exact detached experiment source
      shell: bash
      env:
        EXPECTED_S1: ${{ inputs.expected-s1 }}
        EXPECTED_S2: ${{ inputs.expected-s2 }}
        EXPECTED_COMPATIBILITY: ${{ inputs.expected-compatibility }}
      run: |
        set -euo pipefail
        [[ "$EXPECTED_S1" =~ ^[0-9a-f]{40}$ ]]
        [[ "$EXPECTED_S2" =~ ^[0-9a-f]{40}$ ]]
        [[ "$EXPECTED_COMPATIBILITY" =~ ^[0-9a-f]{64}$ ]]
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_SHA" = "$EXPECTED_S2"
        test "$(git rev-parse HEAD)" = "$EXPECTED_S1"
        test -z "$(git status --porcelain=v1 --untracked-files=no)"

    - name: Set up frozen CPython
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12.13'

    - name: Install hash-locked Python dependencies outside S1
      shell: bash
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/followup-formal-venv"
        "$RUNNER_TEMP/followup-formal-venv/bin/python" -m pip install --require-hashes -r requirements-ci.txt
        "$RUNNER_TEMP/followup-formal-venv/bin/python" -m pip install --require-hashes -r requirements-publication.txt

    - name: Verify exact S1/S2 compatibility
      shell: bash
      env:
        EXPECTED_S1: ${{ inputs.expected-s1 }}
        EXPECTED_S2: ${{ inputs.expected-s2 }}
        EXPECTED_COMPATIBILITY: ${{ inputs.expected-compatibility }}
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/followup-formal-venv/bin/python" scripts/verify_followup_performance_lineage.py \
          --repository-root "$GITHUB_WORKSPACE" \
          --s1 "$EXPECTED_S1" \
          --s2 "$EXPECTED_S2" \
          --expected-receipt-sha256 "$EXPECTED_COMPATIBILITY"

    - name: Download exact producer handoff
      if: inputs.producer-artifact-name != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.producer-artifact-name }}
        path: ${{ runner.temp }}/followup-formal/input/producer

    - name: Download admitted acquisition for ordered-event execution
      if: inputs.acquisition-artifact-name != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.acquisition-artifact-name }}
        path: ${{ runner.temp }}/followup-formal/input/acquisition

    - name: Install native build dependencies and build pinned OpenFHE
      if: inputs.native-build == 'true'
      shell: bash
      env:
        BUILD_JOBS: '2'
        OMP_NUM_THREADS: '2'
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y ninja-build libomp-dev
        scripts/bootstrap_openfhe.sh
        scripts/build_cpp.sh

    - name: Execute exact formal phase
      id: run
      shell: bash
      env:
        EXPECTED_S1: ${{ inputs.expected-s1 }}
        EXPECTED_S2: ${{ inputs.expected-s2 }}
        EXPECTED_COMPATIBILITY: ${{ inputs.expected-compatibility }}
        UNIT_ORDINAL: ${{ inputs.unit-ordinal }}
        EXPECTED_JOB_TOKEN: ${{ inputs.expected-job-token }}
        PHASE: ${{ inputs.phase }}
        PRODUCER_ARTIFACT_NAME: ${{ inputs.producer-artifact-name }}
        ACQUISITION_ARTIFACT_NAME: ${{ inputs.acquisition-artifact-name }}
        OMP_NUM_THREADS: '2'
      run: |
        set -euo pipefail
        install -d -m 700 "$RUNNER_TEMP/followup-formal/unit/scratch"
        install -d -m 700 "$RUNNER_TEMP/followup-formal/unit/out"
        ARGS=(
          --phase "$PHASE"
          --formal-unit-ordinal "$UNIT_ORDINAL"
          --expected-job-token "$EXPECTED_JOB_TOKEN"
          --repository-root "$GITHUB_WORKSPACE"
          --experiment-source-sha "$EXPECTED_S1"
          --workflow-head-sha "$EXPECTED_S2"
          --compatibility-receipt-sha256 "$EXPECTED_COMPATIBILITY"
          --provider-run-id "$GITHUB_RUN_ID"
          --provider-run-attempt "$GITHUB_RUN_ATTEMPT"
          --scratch-root "$RUNNER_TEMP/followup-formal/unit/scratch"
          --output-directory "$RUNNER_TEMP/followup-formal/unit/out/artifact"
        )
        if [[ -n "$PRODUCER_ARTIFACT_NAME" ]]; then
          ARGS+=(--producer-artifact-directory "$RUNNER_TEMP/followup-formal/input/producer")
        fi
        if [[ -n "$ACQUISITION_ARTIFACT_NAME" ]]; then
          ARGS+=(--acquisition-artifact-directory "$RUNNER_TEMP/followup-formal/input/acquisition")
        fi
        "$RUNNER_TEMP/followup-formal-venv/bin/python" \
          scripts/run_followup_performance_formal_unit.py "${ARGS[@]}" \
          > "$RUNNER_TEMP/followup-formal/unit/receipt.json"
        ARTIFACT_NAME="$("$RUNNER_TEMP/followup-formal-venv/bin/python" -c \
          'import json,sys; value=json.load(open(sys.argv[1])); print(value["artifact_name"])' \
          "$RUNNER_TEMP/followup-formal/unit/receipt.json")"
        [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-[a-z0-9-]+$ ]]
        test -d "$RUNNER_TEMP/followup-formal/unit/out/artifact"
        echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

    - name: Upload exact phase artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.run.outputs.artifact_name }}
        path: ${{ runner.temp }}/followup-formal/unit/out/artifact/
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
        compression-level: 0
