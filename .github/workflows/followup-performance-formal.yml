name: Follow-up performance one-shot formal campaign

on:
  workflow_dispatch:
    inputs:
      expected_s1_git_sha:
        description: Exact reviewed follow-up experiment-source S1
        required: true
        type: string
      expected_s2_git_sha:
        description: Exact registration-only S2 on main
        required: true
        type: string
      expected_compatibility_receipt_sha256:
        description: Exact follow-up S1-to-S2 compatibility receipt
        required: true
        type: string
      expected_qualification_run_id:
        description: Sole successful follow-up qualification run
        required: true
        type: string
      expected_authority_claim_oid:
        description: Provider-side one-shot formal-campaign claim object
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: followup-performance-one-shot-formal-campaign
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  FOLLOWUP_EXPECTED_S1: ${{ inputs.expected_s1_git_sha }}
  FOLLOWUP_EXPECTED_S2: ${{ inputs.expected_s2_git_sha }}
  FOLLOWUP_EXPECTED_COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}

jobs:
  launch:
    name: formal-launch-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact S2 authority action only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_s2_git_sha }}
      - name: Bind this sole formal provider run before any formal unit
        uses: ./.github/actions/followup-provider-authority
        with:
          authority-kind: formal
          expected-claim-oid: ${{ inputs.expected_authority_claim_oid }}
          expected-s1: ${{ inputs.expected_s1_git_sha }}
          expected-s2: ${{ inputs.expected_s2_git_sha }}
          expected-compatibility: ${{ inputs.expected_compatibility_receipt_sha256 }}
          expected-qualification-run-id: ${{ inputs.expected_qualification_run_id }}
      - name: Validate dispatch and sole qualification binding
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.expected_qualification_run_id }}
        run: |
          set -euo pipefail
          [[ "$FOLLOWUP_EXPECTED_S1" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FOLLOWUP_EXPECTED_S2" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FOLLOWUP_EXPECTED_COMPATIBILITY" =~ ^[0-9a-f]{64}$ ]]
          [[ "${{ inputs.expected_authority_claim_oid }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$FOLLOWUP_EXPECTED_S2"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID"             > "$RUNNER_TEMP/qualification.json"
          jq -e             --arg head "$FOLLOWUP_EXPECTED_S2"             '.event == "workflow_dispatch"
             and .head_sha == $head
             and .head_branch == "main"
             and .run_attempt == 1
             and .status == "completed"
             and .conclusion == "success"
             and .path == ".github/workflows/followup-performance-qualification.yml"'             "$RUNNER_TEMP/qualification.json" > /dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/followup-performance-qualification.yml/runs?per_page=100"             > "$RUNNER_TEMP/qualification-runs.json"
          jq -e             --argjson expected "$QUALIFICATION_RUN_ID"             '.total_count == 1
             and (.workflow_runs | length) == 1
             and .workflow_runs[0].id == $expected'             "$RUNNER_TEMP/qualification-runs.json" > /dev/null

  u00_producer:
    name: formal-00-acquisition-producer
    needs: launch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.unit.outputs.artifact_name }}
    steps:
      - name: Check out detached exact S1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_s1_git_sha }}
      - name: Execute frozen producer
        id: unit
        uses: ./.github/actions/followup-formal-unit
        with:
          expected-s1: ${{ inputs.expected_s1_git_sha }}
          expected-s2: ${{ inputs.expected_s2_git_sha }}
          expected-compatibility: ${{ inputs.expected_compatibility_receipt_sha256 }}
          unit-ordinal: '0'
          expected-job-token: formal-00-acquisition
          phase: private-handoff
          native-build: 'false'
          retention-days: '1'

  u00_guard:
    name: formal-00-acquisition-independent-replay-and-guard
    needs: u00_producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.unit.outputs.artifact_name }}
