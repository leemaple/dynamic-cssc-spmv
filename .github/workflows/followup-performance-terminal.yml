name: Follow-up performance terminal admission and aggregate

on:
  workflow_dispatch:
    inputs:
      expected_s1_git_sha:
        required: true
        type: string
      expected_s2_git_sha:
        required: true
        type: string
      expected_compatibility_receipt_sha256:
        required: true
        type: string
      expected_campaign_id:
        required: true
        type: string
      expected_terminal_claim_oid:
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: followup-performance-terminal-${{ inputs.expected_campaign_id }}
  cancel-in-progress: false

jobs:
  terminal:
    name: formal-terminal-admission-and-aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact S2 for provider admission
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_s2_git_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify terminal claim and externally armed watcher
        id: admission
        uses: ./.github/actions/followup-terminal-run-admission
        with:
          expected-claim-oid: ${{ inputs.expected_terminal_claim_oid }}
          expected-campaign-id: ${{ inputs.expected_campaign_id }}
          expected-s1: ${{ inputs.expected_s1_git_sha }}
          expected-s2: ${{ inputs.expected_s2_git_sha }}
          expected-compatibility: ${{ inputs.expected_compatibility_receipt_sha256 }}

      - name: Check out detached exact S1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_s1_git_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify exact detached source and dispatch identity
        env:
          EXPECTED_S1: ${{ inputs.expected_s1_git_sha }}
          EXPECTED_S2: ${{ inputs.expected_s2_git_sha }}
          EXPECTED_COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
          CAMPAIGN_ID: ${{ inputs.expected_campaign_id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_S1" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_S2" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_COMPATIBILITY" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CAMPAIGN_ID" =~ ^[0-9a-f]{64}$ ]]
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_S2"
          test "$(git rev-parse HEAD)" = "$EXPECTED_S1"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up frozen CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'

      - name: Install hash-locked Python dependencies outside S1
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/followup-terminal-venv"
          "$RUNNER_TEMP/followup-terminal-venv/bin/python" -m pip install --require-hashes -r requirements-ci.txt
          "$RUNNER_TEMP/followup-terminal-venv/bin/python" -m pip install --require-hashes -r requirements-publication.txt

      - name: Verify exact S1/S2 compatibility
        env:
          EXPECTED_S1: ${{ inputs.expected_s1_git_sha }}
          EXPECTED_S2: ${{ inputs.expected_s2_git_sha }}
          EXPECTED_COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/followup-terminal-venv/bin/python" scripts/verify_followup_performance_lineage.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --s1 "$EXPECTED_S1" \
            --s2 "$EXPECTED_S2" \
            --expected-receipt-sha256 "$EXPECTED_COMPATIBILITY"

      - name: Install campaign controller evidence and fetch selected artifacts
        id: inputs
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/followup-terminal"
          "$RUNNER_TEMP/followup-terminal-venv/bin/python" \
            scripts/prepare_followup_performance_terminal_inputs.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --campaign-transport "${{ steps.admission.outputs.campaign_transport_path }}" \
            --campaign-transport-sha256 "${{ steps.admission.outputs.campaign_transport_sha256 }}" \
            --campaign-transport-member-count "${{ steps.admission.outputs.campaign_transport_member_count }}" \
            --campaign-transport-expanded-bytes "${{ steps.admission.outputs.campaign_transport_expanded_bytes }}" \
            --campaign-evidence-output "$RUNNER_TEMP/followup-terminal/campaign" \
            --formal-artifact-output "$RUNNER_TEMP/followup-terminal/finals" \
            > "$RUNNER_TEMP/followup-terminal/input-receipt.json"

      - name: Independently admit the exact seventeen-unit set
        id: terminal
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/followup-terminal/terminal-output"
          "$RUNNER_TEMP/followup-terminal-venv/bin/python" \
            scripts/run_followup_performance_terminal_admission.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --experiment-source-sha "${{ inputs.expected_s1_git_sha }}" \
            --workflow-head-sha "${{ inputs.expected_s2_git_sha }}" \
            --compatibility-receipt-sha256 "${{ inputs.expected_compatibility_receipt_sha256 }}" \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --campaign-evidence-root "$RUNNER_TEMP/followup-terminal/campaign" \
            --formal-artifact-root "$RUNNER_TEMP/followup-terminal/finals" \
            --output-directory "$RUNNER_TEMP/followup-terminal/terminal-output/artifact" \
            > "$RUNNER_TEMP/followup-terminal/terminal-receipt.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup-terminal/terminal-receipt.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-formal-terminal-admission-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Produce the deterministic admitted aggregate
        id: aggregate
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/followup-terminal/aggregate-output"
          "$RUNNER_TEMP/followup-terminal-venv/bin/python" \
            scripts/run_followup_performance_aggregate.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --experiment-source-sha "${{ inputs.expected_s1_git_sha }}" \
            --workflow-head-sha "${{ inputs.expected_s2_git_sha }}" \
            --compatibility-receipt-sha256 "${{ inputs.expected_compatibility_receipt_sha256 }}" \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --campaign-evidence-root "$RUNNER_TEMP/followup-terminal/campaign" \
            --formal-artifact-root "$RUNNER_TEMP/followup-terminal/finals" \
            --terminal-artifact-directory "$RUNNER_TEMP/followup-terminal/terminal-output/artifact" \
            --output-directory "$RUNNER_TEMP/followup-terminal/aggregate-output/artifact" \
            > "$RUNNER_TEMP/followup-terminal/aggregate-receipt.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup-terminal/aggregate-receipt.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-formal-aggregate-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          jq -sc \
            '{terminal:.[0],aggregate:.[1],schema_version:"dynamic-cssc-followup-performance-terminal-phase-receipt-v1"}' \
            "$RUNNER_TEMP/followup-terminal/terminal-receipt.json" \
            "$RUNNER_TEMP/followup-terminal/aggregate-receipt.json" \
            | sed 's/^/FOLLOWUP_TERMINAL_PHASE_RECEIPT_V1=/'

      - name: Upload terminal admission
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.terminal.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup-terminal/terminal-output/artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload admitted aggregate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.aggregate.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup-terminal/aggregate-output/artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
