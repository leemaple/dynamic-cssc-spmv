name: Publication Day1B PRE-S1 preparatory validation only

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publication-day1b-pre-s1-preparatory
  cancel-in-progress: false

jobs:
  validate-pending-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact validation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Build the two hash-locked validation environments
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-ci.txt
          .venv/bin/python -m pip install --require-hashes -r requirements-publication.txt
      - name: Validate the closed PENDING-FREEZE source contract
        env:
          PYTHONPATH: src:.
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_evidence_compatibility.py \
            tests/test_ordinary_query_lifecycle.py \
            tests/test_publication_day1b.py \
            tests/test_publication_day1b_worker_protocol.py \
            tests/test_publication_day1b_workflow_contract.py
          .venv/bin/python -m ruff check \
            scripts/run_publication_day1b.py \
            src/dynamic_cssc/evidence_compatibility.py \
            src/dynamic_cssc/ordinary_query_lifecycle.py \
            src/dynamic_cssc/publication_day1b.py \
            tests/test_evidence_compatibility.py \
            tests/test_ordinary_query_lifecycle.py \
            tests/test_publication_day1b.py \
            tests/test_publication_day1b_workflow_contract.py
          git diff --check
      - name: Record the deliberate execution boundary
        run: |
          echo 'PENDING-FREEZE resource policy remains non-executable.'
          echo 'The full OpenFHE Day1B runner is absent.'
          echo 'No publication execution or artifact production is permitted.'
