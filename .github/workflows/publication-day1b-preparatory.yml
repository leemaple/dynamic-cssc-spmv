name: Publication Day1B PRE-S1 resource-amendment validation only

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publication-day1b-pre-s1-preparatory
  cancel-in-progress: false

jobs:
  validate-resource-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_JOBS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Check out the exact validation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Build the two hash-locked validation environments
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-ci.txt
          .venv/bin/python -m pip install --require-hashes -r requirements-publication.txt
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      - name: Build the pinned OpenFHE full-query runner
        run: |
          scripts/bootstrap_openfhe.sh
          scripts/build_cpp.sh
      - name: Execute and independently verify both OpenFHE query smokes
        env:
          PYTHONPATH: src:.
        run: >-
          .venv/bin/python scripts/run_openfhe_query_smoke.py
          --runner build/cpp/openfhe_query_runner
          --scratch-dir '${{ runner.temp }}/openfhe-query-smoke'
      - name: Validate the reviewed non-authorizing resource amendment
        env:
          PYTHONPATH: src:.
        run: |
          .venv/bin/python - <<'PY'
          import hashlib
          from pathlib import Path

          from dynamic_cssc.publication_day1b import _decode_day1b_resource_amendment

          amendment = _decode_day1b_resource_amendment(
              Path('config/publication-day1b-resource-amendment.json').read_bytes()
          )
          review = Path(
              'docs/reviews/day1b-resource-amendment-review-2026-08-25.md'
          ).read_bytes()
          assert hashlib.sha256(review).hexdigest() == amendment.review_receipt_sha256
          assert amendment.resource_policy.authority.startswith(
              'non-authorizing-resource-amendment-binding:'
          )
          PY
      - name: Validate the closed PENDING-FREEZE source contract
        env:
          PYTHONPATH: src:.
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_day2_openfhe_key_plan.py \
            tests/test_evidence_compatibility.py \
            tests/test_openfhe_query_runner.py \
            tests/test_openfhe_query_runtime.py \
            tests/test_openfhe_runtime_admission.py \
            tests/test_ordinary_query_lifecycle.py \
            tests/test_publication_day1b.py \
            tests/test_publication_day1b_accounting.py \
            tests/test_publication_day1b_expected_counts.py \
            tests/test_publication_day1b_key_framing.py \
            tests/test_publication_day1b_layout_execution.py \
            tests/test_publication_day1b_replay_execution.py \
            tests/test_publication_day1b_metadata_framing.py \
            tests/test_publication_day1b_openfhe_execution.py \
            tests/test_publication_day1b_scratch.py \
            tests/test_publication_day1b_worker_protocol.py \
            tests/test_publication_day1b_workflow_contract.py \
            tests/test_query_accounting.py \
            tests/test_strong_execution_bundle.py \
            tests/test_strong_day1_simulator.py
          .venv/bin/python -m ruff check \
            scripts/run_publication_day1b.py \
            scripts/run_openfhe_query_smoke.py \
            src/dynamic_cssc/day2_openfhe_key_plan.py \
            src/dynamic_cssc/evidence_compatibility.py \
            src/dynamic_cssc/openfhe_query_runner.py \
            src/dynamic_cssc/openfhe_query_runtime.py \
            src/dynamic_cssc/openfhe_runtime_admission.py \
            src/dynamic_cssc/ordinary_query_lifecycle.py \
            src/dynamic_cssc/publication_day1b.py \
            src/dynamic_cssc/publication_day1b_accounting.py \
            src/dynamic_cssc/publication_day1b_expected_counts.py \
            src/dynamic_cssc/publication_day1b_key_framing.py \
            src/dynamic_cssc/publication_day1b_layout_execution.py \
            src/dynamic_cssc/publication_day1b_replay_execution.py \
            src/dynamic_cssc/publication_day1b_metadata_framing.py \
            src/dynamic_cssc/publication_day1b_openfhe_execution.py \
            src/dynamic_cssc/publication_day1b_scratch.py \
            src/dynamic_cssc/publication_day1b_worker_protocol.py \
            src/dynamic_cssc/simulator.py \
            tests/test_day2_openfhe_key_plan.py \
            tests/test_evidence_compatibility.py \
            tests/test_openfhe_query_runner.py \
            tests/test_openfhe_query_runtime.py \
            tests/test_openfhe_runtime_admission.py \
            tests/test_ordinary_query_lifecycle.py \
            tests/test_publication_day1b.py \
            tests/test_publication_day1b_accounting.py \
            tests/test_publication_day1b_expected_counts.py \
            tests/test_publication_day1b_key_framing.py \
            tests/test_publication_day1b_layout_execution.py \
            tests/test_publication_day1b_replay_execution.py \
            tests/test_publication_day1b_metadata_framing.py \
            tests/test_publication_day1b_openfhe_execution.py \
            tests/test_publication_day1b_scratch.py \
            tests/test_publication_day1b_worker_protocol.py \
            tests/test_publication_day1b_workflow_contract.py \
            tests/test_query_accounting.py \
            tests/test_strong_execution_bundle.py \
            tests/test_strong_day1_simulator.py
          git diff --check
      - name: Record the deliberate execution boundary
        run: |
          echo 'The PENDING-FREEZE placeholder remains immutable.'
          echo 'The reviewed amendment supplies administrative safety budgets only.'
          echo 'The ordinary and strong OpenFHE query paths passed a non-authorizing smoke.'
          echo 'The typed final-anchor Day2 key-plan capability remains unavailable without evidence.'
          echo 'The anchored runtime consumes that capability internally and records its receipt.'
          echo 'The same-replay representative/runtime/payload composition remains pre-admission only.'
          echo 'Its typed D1BKEY01 key receipt remains pre-admission only.'
          echo 'Its Linux READY/DONE executable-map receipt remains pre-admission only.'
          echo 'Linux launcher-owned pathless scratch creation remains pre-admission only.'
          echo 'The production Day1B candidate worker and admission receipt remain absent.'
          echo 'No publication execution or artifact production is permitted.'
