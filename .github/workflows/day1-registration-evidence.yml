name: Day 1 registration descriptive evidence

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: day1-registration-${{ github.repository_id }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  produce-descriptive-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact dispatched source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Build the hash-locked inspection environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-ci.txt
      - name: Verify the descriptive producer contract
        env:
          PYTHONPATH: src
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_day1_registration_evidence.py \
            tests/test_day1_workflow_contract.py \
            tests/test_day1_shard_aggregation.py::test_aggregator_accepts_only_the_complete_21_shard_189_cell_cartesian_product
          .venv/bin/python -m ruff check \
            scripts/produce_day1_registration_evidence.py \
            scripts/aggregate_day1_shards.py \
            src/dynamic_cssc/day1a_export.py \
            src/dynamic_cssc/day1_registration_evidence.py \
            src/dynamic_cssc/evidence_compatibility.py \
            src/dynamic_cssc/publication_artifact_install.py \
            tests/test_day1_registration_evidence.py \
            tests/test_day1_shard_aggregation.py \
            tests/test_day1_workflow_contract.py
      - name: Produce one provider-unverified descriptive archive
        env:
          PYTHONPATH: src
        run: >-
          .venv/bin/python scripts/produce_day1_registration_evidence.py
          --output-dir "${RUNNER_TEMP}/day1-registration-evidence"
      - name: Reinspect the closed archive in a second process
        env:
          ARCHIVE_DIR: ${{ runner.temp }}/day1-registration-evidence
          PYTHONPATH: src
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          from dynamic_cssc.day1_registration_evidence import (
              inspect_day1_registration_evidence_archive,
          )

          inspection = inspect_day1_registration_evidence_archive(
              Path(os.environ["ARCHIVE_DIR"])
          )
          assert inspection.formal_authority_granted is False
          assert inspection.catalog_authority_minted is False
          assert inspection.repository_anchor_installed is False
          PY
      - name: Upload only the descriptive review input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day1-registration-descriptive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/day1-registration-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
