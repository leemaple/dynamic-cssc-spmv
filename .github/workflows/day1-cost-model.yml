name: Day 1 skewed-layout cost model

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Canonical nonnegative decimal seed
        required: true
        default: '20260821'

permissions:
  contents: read

env:
  PYTHONPATH: src:.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      normalized_seed: ${{ steps.normalize-seed.outputs.normalized_seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore or save the single tested Python environment
        id: python-env-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: day1-python-${{ runner.os }}-py312-${{ hashFiles('requirements-ci.txt') }}-${{ github.sha }}
      - name: Install the shared Python environment once
        if: steps.python-env-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run the only short test and Ruff gate
        run: |
          .venv/bin/python scripts/validate_manifest.py config/params_manifest.json
          PYTHONPATH=src:. .venv/bin/python -m pytest -q
          .venv/bin/python -m ruff check .
      - name: Normalize the untrusted dispatch seed exactly once
        id: normalize-seed
        env:
          RAW_SEED: ${{ inputs.seed }}
        run: |
          PYTHONPATH=src:. .venv/bin/python - <<'PY'
          import os

          from scripts.run_day1_suite import parse_canonical_seed

          seed = parse_canonical_seed(os.environ['RAW_SEED'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'normalized_seed={seed}\n')
          PY
      - name: Build the exact 7 workload by 3 freshness matrix
        id: build-matrix
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import re
          from fractions import Fraction

          from scripts.run_day1_suite import freshness_path_id, rho_path_id
          from scripts.run_day1_suite import load_experiment_plan

          plan = load_experiment_plan('config/experiment_plan.json')
          workloads = plan.workloads
          freshness_values = plan.freshness_seconds
          rho_values = plan.ratio_grid
          assert len(workloads) == len(set(workloads)) == 7
          assert len({Fraction(str(value)) for value in freshness_values}) == 3
          assert len({Fraction(str(value)) for value in rho_values}) == 9
          rho_ids = [rho_path_id(Fraction(str(value))) for value in rho_values]
          assert len(rho_ids) == len(set(rho_ids)) == 9

          include = []
          for workload in workloads:
              for raw_freshness in freshness_values:
                  freshness = Fraction(str(raw_freshness))
                  include.append({
                      'workload': workload,
                      'freshness_seconds': str(freshness),
                      'freshness_id': freshness_path_id(freshness),
                  })
          assert len(include) == 21
          matrix = json.dumps({'include': include}, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'matrix={matrix}\n')
          PY

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Day 1 shard (${{ matrix.workload }}, ${{ matrix.freshness_seconds }}s)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the tested Python environment
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: day1-python-${{ runner.os }}-py312-${{ hashFiles('requirements-ci.txt') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Run one workload-freshness shard with all nine rho cells
        env:
          DAY1_SEED: ${{ needs.plan.outputs.normalized_seed }}
          DAY1_WORKLOAD: ${{ matrix.workload }}
          DAY1_FRESHNESS_SECONDS: ${{ matrix.freshness_seconds }}
        run: >-
          .venv/bin/python scripts/run_day1_suite.py
          --output-dir results/day1-shard
          --seed "$DAY1_SEED"
          --workload "$DAY1_WORKLOAD"
          --freshness-seconds "$DAY1_FRESHNESS_SECONDS"
      - name: Independently replay all serialized shard evidence and issue a receipt
        env:
          DAY1_SEED: ${{ needs.plan.outputs.normalized_seed }}
          DAY1_WORKLOAD: ${{ matrix.workload }}
          DAY1_FRESHNESS_SECONDS: ${{ matrix.freshness_seconds }}
          SOURCE_GIT_SHA: ${{ github.sha }}
        run: >-
          .venv/bin/python scripts/replay_day1_shard.py
          --shard-dir results/day1-shard
          --experiment-plan config/experiment_plan.json
          --manifest config/params_manifest.json
          --seed "$DAY1_SEED"
          --workload "$DAY1_WORKLOAD"
          --freshness-seconds "$DAY1_FRESHNESS_SECONDS"
          --source-sha "$SOURCE_GIT_SHA"
      - name: Guard replay receipt, final checksums, and false claim flags
        env:
          EXPECTED_SOURCE_GIT_SHA: ${{ github.sha }}
          EXPECTED_SHARD_SEED: ${{ needs.plan.outputs.normalized_seed }}
          EXPECTED_WORKLOAD: ${{ matrix.workload }}
          EXPECTED_FRESHNESS_SECONDS: ${{ matrix.freshness_seconds }}
          EXPECTED_FRESHNESS_ID: ${{ matrix.freshness_id }}
        run: |
          (cd results/day1-shard && sha256sum --check --strict SHA256SUMS)
          .venv/bin/python - <<'PY'
          import json
          import os
          import re
          from fractions import Fraction
          from pathlib import Path

          p = json.load(open('results/day1-shard/SHARD_STATUS.json'))
          r = json.load(open('results/day1-shard/REPLAY_RECEIPT.json'))
          assert p['schema'] == 'day1-causal-predicted-v1'
          assert p['state_model'] == 'persistent-strategy-snapshots'
          assert p['measurement_kind'] == 'predicted-proxy'
          assert p['gate_eligible'] is False
          assert p['complete_cost_claim_allowed'] is False
          assert p['complete_reference_set'] is False
          assert p['suite_complete'] is False
          assert p['experiment_plan_version'] == '0.2.0'
          assert p['effective_slots'] == 2048
          assert p['partition_rows'] == 128
          assert p['layout_measurement_kind'] == 'synthetic-proxy'
          assert p['planned_bandwidth_profiles_mbps'] == [100.0, 1000.0, 10000.0]
          assert p['deferred_unpriced_plan_dimensions'] == ['bandwidth_profiles_mbps']
          assert p['preflight']['status'] == 'pass'
          assert p['cells_expected'] == p['cells_completed'] == 9
          assert len(p['rho_ids']) == len(set(p['rho_ids'])) == 9

          assert r['schema'] == 'day1-shard-replay-receipt-v1'
          assert r['validator_schema'] == 'day1-independent-replay-validator-v1'
          assert r['validator_version'] == '1'
          assert re.fullmatch(r'[0-9a-f]{64}', r['validator_source_sha256'])
          assert r['source_git_sha'] == os.environ['EXPECTED_SOURCE_GIT_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', r['source_git_sha'])
          assert r['experiment_plan_sha256'] == p['experiment_plan_sha256']
          assert r['manifest_sha256'] == p['manifest_sha256']
          assert r['seed'] == p['seed'] == int(os.environ['EXPECTED_SHARD_SEED'])
          assert r['workload'] == p['workload'] == os.environ['EXPECTED_WORKLOAD']
          assert r['freshness_seconds_fraction'] == p['freshness_seconds_fraction']
          assert r['freshness_seconds_fraction'] == str(
              Fraction(os.environ['EXPECTED_FRESHNESS_SECONDS'])
          )
          assert r['freshness_id'] == os.environ['EXPECTED_FRESHNESS_ID']
          assert r['rho_ids'] == p['rho_ids']
          assert r['cells_expected'] == r['cells_replayed'] == 9
          assert len(r['cells']) == len({c['rho_id'] for c in r['cells']}) == 9
          assert [c['rho_id'] for c in r['cells']] == r['rho_ids']
          assert r['verified'] is True

          cell_keys = {
              'relative_path',
              'rho_id',
              'rho_fraction',
              'event_window_trace_sha256',
              'metrics_json_sha256',
              'derived_artifact_sha256',
          }
          derived_names = {
              'SUMMARY.md',
              'metrics.csv',
              'tuning_aggregates.csv',
              't_rho_proxy.png',
              'ua_vs_qa_proxy.png',
          }
          for cell in r['cells']:
              assert set(cell) == cell_keys
              assert re.fullmatch(r'[0-9a-f]{64}', cell['event_window_trace_sha256'])
              assert re.fullmatch(r'[0-9a-f]{64}', cell['metrics_json_sha256'])
              assert set(cell['derived_artifact_sha256']) == derived_names
              assert all(
                  re.fullmatch(r'[0-9a-f]{64}', digest)
                  for digest in cell['derived_artifact_sha256'].values()
              )

          checksums = Path('results/day1-shard/SHA256SUMS').read_text(encoding='utf-8')
          assert '  REPLAY_RECEIPT.json' in checksums
          assert '  SHARD_STATUS.json' in checksums
          PY
      - name: Upload uniquely named shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: r2-day1-shard-${{ github.sha }}-${{ needs.plan.outputs.normalized_seed }}-${{ matrix.workload }}-${{ matrix.freshness_id }}
          include-hidden-files: true
          path: results/day1-shard/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [plan, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the tested Python environment
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: day1-python-${{ runner.os }}-py312-${{ hashFiles('requirements-ci.txt') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Download 21 shards into downloaded-shards/<artifact-name>/SHARD_STATUS.json
        uses: actions/download-artifact@v4
        with:
          pattern: r2-day1-shard-${{ github.sha }}-${{ needs.plan.outputs.normalized_seed }}-*
          path: downloaded-shards
          merge-multiple: false
      - name: Fail-closed validation and aggregation of all 189 cells
        env:
          DAY1_SEED: ${{ needs.plan.outputs.normalized_seed }}
          SOURCE_GIT_SHA: ${{ github.sha }}
        run: >-
          .venv/bin/python scripts/aggregate_day1_shards.py
          --shards-dir downloaded-shards
          --output-dir results/day1
          --seed "$DAY1_SEED"
          --source-sha "$SOURCE_GIT_SHA"
      - name: Guard the only complete-suite status
        env:
          EXPECTED_SOURCE_GIT_SHA: ${{ github.sha }}
        run: |
          (cd results/day1 && sha256sum --check --strict SHA256SUMS)
          .venv/bin/python - <<'PY'
          import json
          import os
          import re

          p = json.load(open('results/day1/SUITE_STATUS.json'))
          assert p['schema'] == 'day1-causal-predicted-v1'
          assert p['state_model'] == 'persistent-strategy-snapshots'
          assert p['measurement_kind'] == 'predicted-proxy'
          assert p['gate_eligible'] is False
          assert p['complete_cost_claim_allowed'] is False
          assert p['complete_reference_set'] is False
          assert p['suite_complete'] is True
          assert p['experiment_plan_version'] == '0.2.0'
          assert p['effective_slots'] == 2048
          assert p['partition_rows'] == 128
          assert p['layout_measurement_kind'] == 'synthetic-proxy'
          assert p['planned_bandwidth_profiles_mbps'] == [100.0, 1000.0, 10000.0]
          assert p['deferred_unpriced_plan_dimensions'] == ['bandwidth_profiles_mbps']
          assert p['preflight']['status'] == 'pass'
          assert p['shards_expected'] == p['shards_completed'] == 21
          assert p['cells_expected'] == p['cells_completed'] == 189
          assert p['source_git_sha'] == os.environ['EXPECTED_SOURCE_GIT_SHA']
          assert p['replay_receipts_expected'] == p['replay_receipts_completed'] == 21
          assert p['replay_receipt_schema'] == 'day1-shard-replay-receipt-v1'
          assert p['replay_validator_schema'] == 'day1-independent-replay-validator-v1'
          assert len(p['replay_receipts']) == 21
          receipt_item_keys = {
              'relative_path',
              'sha256',
              'workload',
              'freshness_seconds_fraction',
          }
          for item in p['replay_receipts']:
              assert set(item) == receipt_item_keys
              assert item['relative_path'].startswith('replay-receipts/')
              assert re.fullmatch(r'[0-9a-f]{64}', item['sha256'])
          assert len({item['relative_path'] for item in p['replay_receipts']}) == 21
          assert len({
              (item['workload'], item['freshness_seconds_fraction'])
              for item in p['replay_receipts']
          }) == 21
          print('All synthetic shards completed; no paper gate verdict issued.')
          PY
      - name: Create R2 audit bundle
        run: >-
          .venv/bin/python scripts/package_review_bundle.py
          --stage R2-Day1-synthetic
          --output-dir artifacts
          --include results/day1
      - name: Upload aggregated Day 1 evidence and R2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: r2-day1-${{ github.sha }}-${{ needs.plan.outputs.normalized_seed }}
          include-hidden-files: true
          path: |
            results/day1/
            artifacts/
          if-no-files-found: error
          retention-days: 30
