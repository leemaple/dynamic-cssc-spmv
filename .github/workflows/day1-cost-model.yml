name: Day 1 skewed-layout cost model

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Canonical nonnegative decimal seed
        required: true
        default: '20260821'

permissions:
  contents: read

env:
  PYTHONPATH: src:.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      normalized_seed: ${{ steps.normalize-seed.outputs.normalized_seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore or save the single tested Python environment
        id: python-env-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: day1-python-${{ runner.os }}-py312-${{ hashFiles('requirements-ci.txt') }}-${{ github.sha }}
      - name: Install the shared Python environment once
        if: steps.python-env-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run the only short test and Ruff gate
        run: |
          .venv/bin/python scripts/validate_manifest.py config/params_manifest.json
          PYTHONPATH=src:. .venv/bin/python -m pytest -q \
            tests/test_day1_registry.py \
            tests/test_query_accounting.py \
            tests/test_report.py \
            tests/test_strong_day1_simulator.py
          .venv/bin/python -m ruff check \
            scripts/aggregate_day1_shards.py \
            scripts/package_review_bundle.py \
            scripts/produce_day1_registration_evidence.py \
            scripts/replay_day1_shard.py \
            scripts/run_day1_suite.py \
            scripts/validate_manifest.py \
            src/dynamic_cssc/__init__.py \
            src/dynamic_cssc/cloud_execution_plan.py \
            src/dynamic_cssc/cssc.py \
            src/dynamic_cssc/day1a_export.py \
            src/dynamic_cssc/day1_registration_evidence.py \
            src/dynamic_cssc/day1_registry.py \
            src/dynamic_cssc/evidence_compatibility.py \
            src/dynamic_cssc/events.py \
            src/dynamic_cssc/manifest.py \
            src/dynamic_cssc/mask_ledger.py \
            src/dynamic_cssc/metrics.py \
            src/dynamic_cssc/output_plan.py \
            src/dynamic_cssc/plaintext_oracle.py \
            src/dynamic_cssc/preflight.py \
            src/dynamic_cssc/publication_traces.py \
            src/dynamic_cssc/query_compiler.py \
            src/dynamic_cssc/report.py \
            src/dynamic_cssc/selection.py \
            src/dynamic_cssc/simulator.py \
            src/dynamic_cssc/span80.py \
            src/dynamic_cssc/strategy_state.py \
            src/dynamic_cssc/strong_execution.py \
            src/dynamic_cssc/strong_packed_coo.py \
            src/dynamic_cssc/strong_reference_receipt.py \
            src/dynamic_cssc/workloads.py \
            tests/test_day1_registration_evidence.py \
            tests/test_day1_registry.py \
            tests/test_query_accounting.py \
            tests/test_report.py \
            tests/test_strong_day1_simulator.py
      - name: Normalize the untrusted dispatch seed exactly once
        id: normalize-seed
        env:
          RAW_SEED: ${{ inputs.seed }}
        run: |
          PYTHONPATH=src:. .venv/bin/python - <<'PY'
          import os

          from scripts.run_day1_suite import parse_canonical_seed

          seed = parse_canonical_seed(os.environ['RAW_SEED'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'normalized_seed={seed}\n')
          PY
      - name: Build the exact 7 workload by 3 freshness matrix
        id: build-matrix
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import re
          from fractions import Fraction

          from scripts.run_day1_suite import freshness_path_id, rho_path_id
          from scripts.run_day1_suite import load_experiment_plan

          plan = load_experiment_plan('config/experiment_plan.json')
          workloads = plan.workloads
          freshness_values = plan.freshness_seconds
          rho_values = plan.ratio_grid
          assert len(workloads) == len(set(workloads)) == 7
          assert len({Fraction(str(value)) for value in freshness_values}) == 3
          assert len({Fraction(str(value)) for value in rho_values}) == 9
          rho_ids = [rho_path_id(Fraction(str(value))) for value in rho_values]
          assert len(rho_ids) == len(set(rho_ids)) == 9

          include = []
          for workload in workloads:
              for raw_freshness in freshness_values:
                  freshness = Fraction(str(raw_freshness))
                  include.append({
                      'workload': workload,
                      'freshness_seconds': str(freshness),
                      'freshness_id': freshness_path_id(freshness),
                  })
          assert len(include) == 21
          matrix = json.dumps({'include': include}, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'matrix={matrix}\n')
          PY

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Day 1 shard (${{ matrix.workload }}, ${{ matrix.freshness_seconds }}s)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the tested Python environment
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: day1-python-${{ runner.os }}-py312-${{ hashFiles('requirements-ci.txt') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Run one workload-freshness shard with all nine rho cells
        env:
          DAY1_SEED: ${{ needs.plan.outputs.normalized_seed }}
          DAY1_WORKLOAD: ${{ matrix.workload }}
          DAY1_FRESHNESS_SECONDS: ${{ matrix.freshness_seconds }}
        run: >-
          .venv/bin/python scripts/run_day1_suite.py
          --output-dir results/day1-shard
          --seed "$DAY1_SEED"
          --workload "$DAY1_WORKLOAD"
          --freshness-seconds "$DAY1_FRESHNESS_SECONDS"
      - name: Independently replay all serialized shard evidence and issue a receipt
        env:
          DAY1_SEED: ${{ needs.plan.outputs.normalized_seed }}
          DAY1_WORKLOAD: ${{ matrix.workload }}
          DAY1_FRESHNESS_SECONDS: ${{ matrix.freshness_seconds }}
          SOURCE_GIT_SHA: ${{ github.sha }}
        run: >-
          .venv/bin/python scripts/replay_day1_shard.py
          --shard-dir results/day1-shard
          --experiment-plan config/experiment_plan.json
          --manifest config/params_manifest.json
          --seed "$DAY1_SEED"
          --workload "$DAY1_WORKLOAD"
          --freshness-seconds "$DAY1_FRESHNESS_SECONDS"
          --source-sha "$SOURCE_GIT_SHA"
      - name: Guard replay receipt, final checksums, and false claim flags
        env:
          EXPECTED_SOURCE_GIT_SHA: ${{ github.sha }}
          EXPECTED_SHARD_SEED: ${{ needs.plan.outputs.normalized_seed }}
          EXPECTED_WORKLOAD: ${{ matrix.workload }}
          EXPECTED_FRESHNESS_SECONDS: ${{ matrix.freshness_seconds }}
          EXPECTED_FRESHNESS_ID: ${{ matrix.freshness_id }}
        run: |
          (cd results/day1-shard && sha256sum --check --strict SHA256SUMS)
          .venv/bin/python - <<'PY'
          import json
          import os
          import re
          from fractions import Fraction
          from pathlib import Path

          from dynamic_cssc.day1_registry import repository_day1_candidate_catalog

          p = json.load(open('results/day1-shard/SHARD_STATUS.json'))
          r = json.load(open('results/day1-shard/REPLAY_RECEIPT.json'))
          catalog = repository_day1_candidate_catalog()
          fixed_candidate_ids = sorted(c.candidate_id for c in catalog.candidates)
          reference_candidate_ids = sorted(
              c.candidate_id for c in catalog.selection_candidates
          )
          ablation_candidate_ids = sorted(c.candidate_id for c in catalog.ablation_candidates)
          assert p['schema'] == 'day1-causal-predicted-v2'
          assert p['state_model'] == 'persistent-strategy-snapshots'
          assert p['measurement_kind'] == 'predicted-proxy'
          assert p['gate_eligible'] is False
          assert p['complete_cost_claim_allowed'] is False
          assert p['security_claim_allowed'] is False
          assert p['formal_performance_claim'] is False
          assert p['complete_reference_set'] is True
          assert p['suite_complete'] is False
          assert p['fixed_candidate_count'] == 14
          assert p['reference_candidate_count'] == 13
          assert p['ablation_candidate_count'] == 1
          assert p['candidate_ids'] == fixed_candidate_ids
          assert p['reference_candidate_ids'] == reference_candidate_ids
          assert p['ablation_candidate_ids'] == ablation_candidate_ids
          assert ablation_candidate_ids == ['packed-coo-client-lane-delta/capacity=128']
          assert set(reference_candidate_ids).isdisjoint(ablation_candidate_ids)
          assert set(fixed_candidate_ids) == set(reference_candidate_ids) | set(
              ablation_candidate_ids
          )
          assert p['deferred_reference_baselines'] == []
          assert p['experiment_plan_version'] == '0.2.0'
          assert p['effective_slots'] == 2048
          assert p['partition_rows'] == 128
          assert p['layout_measurement_kind'] == 'synthetic-proxy'
          assert p['planned_bandwidth_profiles_mbps'] == [100.0, 1000.0, 10000.0]
          assert p['deferred_unpriced_plan_dimensions'] == ['bandwidth_profiles_mbps']
          assert p['preflight']['status'] == 'pass'
          assert p['cells_expected'] == p['cells_completed'] == 9
          assert len(p['rho_ids']) == len(set(p['rho_ids'])) == 9

          assert r['schema'] == 'day1-shard-replay-receipt-v1'
          assert r['validator_schema'] == 'day1-separate-deterministic-replay-validator-v2'
          assert r['validator_version'] == '2'
          assert re.fullmatch(r'[0-9a-f]{64}', r['validator_source_sha256'])
          assert r['source_git_sha'] == os.environ['EXPECTED_SOURCE_GIT_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', r['source_git_sha'])
          assert r['experiment_plan_sha256'] == p['experiment_plan_sha256']
          assert r['manifest_sha256'] == p['manifest_sha256']
          assert r['seed'] == p['seed'] == int(os.environ['EXPECTED_SHARD_SEED'])
          assert r['workload'] == p['workload'] == os.environ['EXPECTED_WORKLOAD']
          assert r['freshness_seconds_fraction'] == p['freshness_seconds_fraction']
          assert r['freshness_seconds_fraction'] == str(
              Fraction(os.environ['EXPECTED_FRESHNESS_SECONDS'])
          )
          assert r['freshness_id'] == os.environ['EXPECTED_FRESHNESS_ID']
          assert r['rho_ids'] == p['rho_ids']
          assert r['cells_expected'] == r['cells_replayed'] == 9
          assert len(r['cells']) == len({c['rho_id'] for c in r['cells']}) == 9
          assert [c['rho_id'] for c in r['cells']] == r['rho_ids']
          assert r['verified'] is True

          cell_keys = {
              'relative_path',
              'rho_id',
              'rho_fraction',
              'event_window_trace_sha256',
              'metrics_json_sha256',
              'derived_artifact_sha256',
          }
          derived_names = {
              'SUMMARY.md',
              'metrics.csv',
              'tuning_aggregates.csv',
              't_rho_proxy.png',
              'ua_vs_qa_proxy.png',
          }
          for cell in r['cells']:
              assert set(cell) == cell_keys
              assert re.fullmatch(r'[0-9a-f]{64}', cell['event_window_trace_sha256'])
              assert re.fullmatch(r'[0-9a-f]{64}', cell['metrics_json_sha256'])
              assert set(cell['derived_artifact_sha256']) == derived_names
              assert all(
                  re.fullmatch(r'[0-9a-f]{64}', digest)
                  for digest in cell['derived_artifact_sha256'].values()
              )

          checksums = Path('results/day1-shard/SHA256SUMS').read_text(encoding='utf-8')
          assert '  REPLAY_RECEIPT.json' in checksums
          assert '  SHARD_STATUS.json' in checksums
          PY
      - name: Upload uniquely named shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: r2-day1-shard-${{ github.sha }}-${{ needs.plan.outputs.normalized_seed }}-${{ matrix.workload }}-${{ matrix.freshness_id }}
          include-hidden-files: true
          path: results/day1-shard/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [plan, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the tested Python environment
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: day1-python-${{ runner.os }}-py312-${{ hashFiles('requirements-ci.txt') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Download 21 shards into downloaded-shards/<artifact-name>/SHARD_STATUS.json
        uses: actions/download-artifact@v4
        with:
          pattern: r2-day1-shard-${{ github.sha }}-${{ needs.plan.outputs.normalized_seed }}-*
          path: downloaded-shards
          merge-multiple: false
      - name: Fail-closed validation and aggregation of all 189 cells
        env:
          DAY1_SEED: ${{ needs.plan.outputs.normalized_seed }}
          SOURCE_GIT_SHA: ${{ github.sha }}
        run: >-
          .venv/bin/python scripts/aggregate_day1_shards.py
          --shards-dir downloaded-shards
          --output-dir results/day1
          --seed "$DAY1_SEED"
          --source-sha "$SOURCE_GIT_SHA"
      - name: Guard the only complete-suite status
        env:
          EXPECTED_SOURCE_GIT_SHA: ${{ github.sha }}
        run: |
          (cd results/day1 && sha256sum --check --strict SHA256SUMS)
          .venv/bin/python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          from dynamic_cssc.day1_registry import repository_day1_candidate_catalog
          from dynamic_cssc.report import validate_causal_payload

          p = json.load(open('results/day1/SUITE_STATUS.json'))
          count_bundle = json.load(open('results/day1/DAY1A_COUNT_BUNDLE.json'))
          rotation_inventory = json.load(open('results/day1/DAY1A_ROTATION_INVENTORY.json'))
          day1a_receipt = json.load(open('results/day1/DAY1A_AUTHORITY_RECEIPT.json'))
          catalog = repository_day1_candidate_catalog()
          fixed_candidate_ids = sorted(c.candidate_id for c in catalog.candidates)
          reference_candidate_ids = sorted(
              c.candidate_id for c in catalog.selection_candidates
          )
          ablation_candidate_ids = sorted(c.candidate_id for c in catalog.ablation_candidates)
          assert p['schema'] == 'day1-causal-predicted-v2'
          assert p['state_model'] == 'persistent-strategy-snapshots'
          assert p['measurement_kind'] == 'predicted-proxy'
          assert p['gate_eligible'] is False
          assert p['complete_cost_claim_allowed'] is False
          assert p['security_claim_allowed'] is False
          assert p['formal_performance_claim'] is False
          assert p['complete_reference_set'] is True
          assert p['suite_complete'] is True
          assert p['fixed_candidate_count'] == 14
          assert p['reference_candidate_count'] == 13
          assert p['ablation_candidate_count'] == 1
          assert p['candidate_ids'] == fixed_candidate_ids
          assert p['reference_candidate_ids'] == reference_candidate_ids
          assert p['ablation_candidate_ids'] == ablation_candidate_ids
          assert ablation_candidate_ids == ['packed-coo-client-lane-delta/capacity=128']
          assert set(reference_candidate_ids).isdisjoint(ablation_candidate_ids)
          assert set(fixed_candidate_ids) == set(reference_candidate_ids) | set(
              ablation_candidate_ids
          )
          assert p['deferred_reference_baselines'] == []
          assert p['experiment_plan_version'] == '0.2.0'
          assert p['effective_slots'] == 2048
          assert p['partition_rows'] == 128
          assert p['layout_measurement_kind'] == 'synthetic-proxy'
          assert p['planned_bandwidth_profiles_mbps'] == [100.0, 1000.0, 10000.0]
          assert p['deferred_unpriced_plan_dimensions'] == ['bandwidth_profiles_mbps']
          assert p['preflight']['status'] == 'pass'
          assert p['shards_expected'] == p['shards_completed'] == 21
          assert p['cells_expected'] == p['cells_completed'] == 189
          assert p['source_git_sha'] == os.environ['EXPECTED_SOURCE_GIT_SHA']
          assert p['replay_receipts_expected'] == p['replay_receipts_completed'] == 21
          assert p['replay_receipt_schema'] == 'day1-shard-replay-receipt-v1'
          assert p['replay_validator_schema'] == 'day1-separate-deterministic-replay-validator-v2'
          assert len(p['replay_receipts']) == 21
          receipt_item_keys = {
              'relative_path',
              'sha256',
              'workload',
              'freshness_seconds_fraction',
          }
          for item in p['replay_receipts']:
              assert set(item) == receipt_item_keys
              assert item['relative_path'].startswith('replay-receipts/')
              assert re.fullmatch(r'[0-9a-f]{64}', item['sha256'])
          assert len({item['relative_path'] for item in p['replay_receipts']}) == 21
          assert len({
              (item['workload'], item['freshness_seconds_fraction'])
              for item in p['replay_receipts']
          }) == 21
          assert count_bundle['schema_version'] == 'dynamic-cssc-day1a-count-bundle-v1'
          assert count_bundle['source_git_sha'] == p['source_git_sha']
          assert count_bundle['cell_count'] == 189
          assert count_bundle['fixed_record_count'] == 189 * 14
          assert len(count_bundle['records']) == 189 * 14
          assert rotation_inventory['schema_version'] == (
              'dynamic-cssc-day1a-rotation-inventory-v1'
          )
          assert rotation_inventory['source_git_sha'] == p['source_git_sha']
          assert rotation_inventory['rows'] == 512
          assert rotation_inventory['cols'] == 512
          assert rotation_inventory['effective_slots'] == 2048
          assert rotation_inventory['partition_rows'] == 128
          assert rotation_inventory['publication_rows'] == 4096
          assert rotation_inventory['publication_cols'] == 8193
          assert rotation_inventory['publication_effective_slots'] == 4096
          assert rotation_inventory['publication_partition_rows'] == 4096
          assert rotation_inventory['publication_domain_match'] is False
          assert rotation_inventory['day2_direct_key_plan_eligible'] is False
          assert rotation_inventory['required_exact_indices']
          assert day1a_receipt['schema_version'] == (
              'dynamic-cssc-day1a-authority-receipt-v1'
          )
          assert day1a_receipt['source_git_sha'] == p['source_git_sha']
          assert day1a_receipt['day1a_count_evidence_authorized'] is True
          assert day1a_receipt['day2_direct_key_plan_authorized'] is False
          assert day1a_receipt['complete_cost_claim_allowed'] is False
          assert day1a_receipt['formal_performance_claim_allowed'] is False
          assert day1a_receipt['paper_verdict_allowed'] is False
          assert day1a_receipt['security_claim_allowed'] is False

          metrics_paths = sorted(Path('results/day1').glob('*/*/*/metrics.json'))
          assert len(metrics_paths) == 189
          for metrics_path in metrics_paths:
              payload = json.loads(metrics_path.read_text(encoding='utf-8'))
              validate_causal_payload(payload)
              assert len(payload['records']) == 16
              proof = payload['completion_proof']
              assert proof['fixed_candidate_count'] == 14
              assert proof['reference_candidate_count'] == 13
              assert proof['ablation_candidate_count'] == 1
              assert proof['tuning_candidate_count'] == 13
              assert proof['record_count'] == 16
              proof_inventories = {
                  item['candidate_id']: item
                  for item in proof['fixed_rotation_inventories']
              }
              assert set(proof_inventories) == set(fixed_candidate_ids)
              fixed_records = {
                  record['candidate_id']: record
                  for record in payload['records']
                  if record['record_kind'] == 'fixed-candidate'
              }
              assert set(fixed_records) == set(fixed_candidate_ids)
              for candidate_id, record in fixed_records.items():
                  inventory = record['rotation_inventory']
                  measured = {
                      index: count
                      for index, count in inventory['measured_counts_by_exact_index']
                  }
                  required = set(inventory['required_indices'])
                  assert set(measured).issubset(required)
                  assert sum(measured.values()) == record['rotations']
                  assert proof_inventories[candidate_id] == {
                      'candidate_id': candidate_id,
                      **inventory,
                  }
          print('All synthetic shards completed; no paper gate verdict issued.')
          PY
      - name: Create R2 audit bundle
        run: >-
          .venv/bin/python scripts/package_review_bundle.py
          --stage R2-Day1-synthetic
          --output-dir artifacts
          --include results/day1
      - name: Upload aggregated Day 1 evidence and R2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: r2-day1-${{ github.sha }}-${{ needs.plan.outputs.normalized_seed }}
          include-hidden-files: true
          path: |
            results/day1/
            artifacts/
          if-no-files-found: error
          retention-days: 30
