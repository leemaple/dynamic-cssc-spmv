name: Follow-up performance exact-head Linux CI

on:
  workflow_dispatch:
    inputs:
      expected_s1_git_sha:
        required: true
        type: string
      expected_s2_git_sha:
        required: true
        type: string
      expected_compatibility_receipt_sha256:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: followup-performance-exact-head-ci
  cancel-in-progress: false

jobs:
  exact-head-linux-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate identities before checkout
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
        run: |
          [[ "$S1" =~ ^[0-9a-f]{40}$ ]]
          [[ "$S2" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMPATIBILITY" =~ ^[0-9a-f]{64}$ ]]
      - name: Check out detached exact S1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_s1_git_sha }}
      - name: Verify S2 dispatch and exact S1 source
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$S2"
          test "$(git rev-parse HEAD)" = "$S1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Build hash-locked test environments
        run: |
          python -m venv "$RUNNER_TEMP/followup-ci-venv"
          "$RUNNER_TEMP/followup-ci-venv/bin/python" -m pip install --require-hashes -r requirements-ci.txt
          "$RUNNER_TEMP/followup-ci-venv/bin/python" -m pip install --require-hashes -r requirements-publication.txt
      - name: Verify exact follow-up S1/S2 compatibility
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
          PYTHONPATH: src:.
        run: |
          "$RUNNER_TEMP/followup-ci-venv/bin/python" scripts/verify_followup_performance_lineage.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --s1 "$S1" \
            --s2 "$S2" \
            --expected-receipt-sha256 "$COMPATIBILITY"
      - name: Compile Python source
        env:
          PYTHONPATH: src:.
        run: >-
          "$RUNNER_TEMP/followup-ci-venv/bin/python" -m compileall -q src scripts tests
      - name: Run the exact full test suite
        env:
          PYTHONPATH: src:.
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          install -d "$RUNNER_TEMP/followup-ci-results"
          "$RUNNER_TEMP/followup-ci-venv/bin/python" -m pytest -q \
            --junitxml="$RUNNER_TEMP/followup-ci-results/junit.xml"
      - name: Run the exact static gate
        env:
          PYTHONPATH: src:.
        run: |
          "$RUNNER_TEMP/followup-ci-venv/bin/python" -m ruff check src scripts tests
          git diff --check
      - name: Package authority-false CI receipt
        id: receipt
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
          PYTHONPATH: src:.
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup-ci-artifact-parent"
          "$RUNNER_TEMP/followup-ci-venv/bin/python" scripts/render_followup_performance_control_receipt.py \
            --kind ci \
            --experiment-source-s1-sha "$S1" \
            --evidence-freeze-s2-sha "$S2" \
            --compatibility-receipt-sha256 "$COMPATIBILITY" \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --detail full_test_suite=success \
            --detail python_compile=success \
            --detail ruff_and_diff_check=success \
            --output "$RUNNER_TEMP/followup-ci-receipt.json"
          "$RUNNER_TEMP/followup-ci-venv/bin/python" scripts/package_followup_performance_control_artifact.py \
            --kind ci \
            --receipt "$RUNNER_TEMP/followup-ci-receipt.json" \
            --output-directory "$RUNNER_TEMP/followup-ci-artifact-parent/artifact" \
            > "$RUNNER_TEMP/followup-ci-package.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup-ci-package.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-control-ci-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact authority-false CI receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup-ci-artifact-parent/artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
