name: Route A descriptive registration

on:
  workflow_dispatch:
    inputs:
      expected_s1:
        description: Exact reviewed clean Route A S1 commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: route-a-registration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  produce-descriptive-registration:
    name: Produce and independently reinspect non-authorizing Route A registration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact S1 with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_s1 }}

      - name: Set up exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13

      - name: Install the hash-locked validation environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-ci.txt

      - name: Reject any checkout other than clean exact S1
        env:
          EXPECTED_S1: ${{ inputs.expected_s1 }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_S1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify the closed registration producer and inspector
        env:
          PYTHONPATH: src
        run: |
          .venv/bin/python -m pytest -q tests/test_route_a_lineage.py
          .venv/bin/python -m ruff check \
            src/dynamic_cssc/route_a_lineage.py \
            scripts/produce_route_a_registration.py \
            scripts/verify_route_a_registration.py \
            tests/test_route_a_lineage.py

      - name: Produce the descriptive archive from exact S1
        env:
          EXPECTED_S1: ${{ inputs.expected_s1 }}
          PYTHONPATH: src
        run: |
          .venv/bin/python scripts/produce_route_a_registration.py \
            --repository-root . \
            --expected-s1 "$EXPECTED_S1" \
            --output "$RUNNER_TEMP/route-a-registration.zip" \
            > "$RUNNER_TEMP/producer-receipt.json"

      - name: Reinspect the archive in a second interpreter
        env:
          EXPECTED_S1: ${{ inputs.expected_s1 }}
          PYTHONPATH: src
        run: |
          .venv/bin/python scripts/verify_route_a_registration.py \
            --repository-root . \
            --expected-s1 "$EXPECTED_S1" \
            --archive "$RUNNER_TEMP/route-a-registration.zip" \
            > "$RUNNER_TEMP/inspection-receipt.json"

      - name: Upload descriptive registration only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-a-registration-descriptive-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/route-a-registration.zip
            ${{ runner.temp }}/producer-receipt.json
            ${{ runner.temp }}/inspection-receipt.json
          if-no-files-found: error
          retention-days: 30
