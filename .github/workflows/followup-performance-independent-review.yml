name: Follow-up performance independent Stage-2 review witness

on:
  workflow_dispatch:
    inputs:
      expected_s1_git_sha:
        description: Exact reviewed follow-up experiment-source S1 commit
        required: true
        type: string
      expected_s2_git_sha:
        description: Exact terminal data-only follow-up S2 commit on main
        required: true
        type: string
      expected_compatibility_receipt_sha256:
        description: Exact follow-up S1-to-S2 compatibility receipt SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: followup-performance-independent-stage2-review
  cancel-in-progress: false

jobs:
  independent-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out terminal data-only S2 with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_s2_git_sha }}
      - name: Set up exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Build hash-locked review environment
        run: |
          python -m venv "$RUNNER_TEMP/followup-review-venv"
          "$RUNNER_TEMP/followup-review-venv/bin/python" -m pip install --require-hashes -r requirements-ci.txt
          "$RUNNER_TEMP/followup-review-venv/bin/python" -m pip install --require-hashes -r requirements-publication.txt
      - name: Verify exact S1/S2 and independent review closure
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
          PYTHONPATH: src:.
        run: |
          [[ "$S1" =~ ^[0-9a-f]{40}$ ]]
          [[ "$S2" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMPATIBILITY" =~ ^[0-9a-f]{64}$ ]]
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$S2"
          test "$(git rev-parse HEAD)" = "$S2"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          "$RUNNER_TEMP/followup-review-venv/bin/python" scripts/verify_followup_performance_lineage.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --s1 "$S1" \
            --s2 "$S2" \
            --expected-receipt-sha256 "$COMPATIBILITY"
          git show "$S1:docs/reviews/followup-performance-stage2-review.md" \
            > "$RUNNER_TEMP/followup-stage2-review.md"
          test "$(git show "$S2:docs/reviews/followup-performance-stage2-review.md")" = \
            "$(cat "$RUNNER_TEMP/followup-stage2-review.md")"
          grep -Fx 'Verdict: PASS — P0=0, P1=0.' "$RUNNER_TEMP/followup-stage2-review.md"
          grep -Fx 'External gate: ChatGPT Pro PASS; ZCode strongest-mode PASS.' \
            "$RUNNER_TEMP/followup-stage2-review.md"
          if grep -Eiq '(^|[^A-Z])(P0|P1)[^0-9]*(open|hold|unresolved|amend)' \
            "$RUNNER_TEMP/followup-stage2-review.md"; then
            echo 'review still contains an unresolved P0/P1 marker' >&2
            exit 2
          fi
      - name: Recheck the controller and evidence-boundary contract
        env:
          PYTHONPATH: src:.
        run: |
          "$RUNNER_TEMP/followup-review-venv/bin/python" -m pytest -q \
            tests/test_followup_performance_contract.py \
            tests/test_followup_performance_lineage.py \
            tests/test_followup_performance_control_artifacts.py \
            tests/test_followup_performance_artifacts.py \
            tests/test_followup_performance_controller.py \
            tests/test_followup_performance_workflows.py
          "$RUNNER_TEMP/followup-review-venv/bin/python" -m ruff check \
            src/dynamic_cssc/followup_performance_*.py \
            scripts/*followup_performance*.py \
            tests/test_followup_performance_*.py
          git diff --check
      - name: Produce authority-false independent-review artifact
        id: artifact
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
          PYTHONPATH: src:.
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup-review-artifact-parent"
          "$RUNNER_TEMP/followup-review-venv/bin/python" scripts/render_followup_performance_control_receipt.py \
            --kind independent-review \
            --experiment-source-s1-sha "$S1" \
            --evidence-freeze-s2-sha "$S2" \
            --compatibility-receipt-sha256 "$COMPATIBILITY" \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --detail bounded_implementation_diff=pass \
            --detail publication_authority=absent \
            --detail unresolved_p0_or_p1=zero \
            --output "$RUNNER_TEMP/followup-review-receipt.json"
          "$RUNNER_TEMP/followup-review-venv/bin/python" scripts/package_followup_performance_control_artifact.py \
            --kind independent-review \
            --receipt "$RUNNER_TEMP/followup-review-receipt.json" \
            --output-directory "$RUNNER_TEMP/followup-review-artifact-parent/artifact" \
            > "$RUNNER_TEMP/followup-review-package.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup-review-package.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-control-independent-review-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload independent-review witness only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup-review-artifact-parent/artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
