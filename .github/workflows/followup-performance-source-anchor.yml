name: Follow-up performance terminal data-only source anchor

on:
  workflow_dispatch:
    inputs:
      expected_s1_git_sha:
        required: true
        type: string
      expected_s2_git_sha:
        required: true
        type: string
      expected_compatibility_receipt_sha256:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: followup-performance-source-anchor
  cancel-in-progress: false

jobs:
  source-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate identities before checkout
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
        run: |
          [[ "$S1" =~ ^[0-9a-f]{40}$ ]]
          [[ "$S2" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMPATIBILITY" =~ ^[0-9a-f]{64}$ ]]
      - name: Check out exact data-only S2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_s2_git_sha }}
      - name: Verify exact S2 checkout
        env:
          S2: ${{ inputs.expected_s2_git_sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$S2"
          test "$(git rev-parse HEAD)" = "$S2"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Build hash-locked control environment
        run: |
          python -m venv "$RUNNER_TEMP/followup-anchor-venv"
          "$RUNNER_TEMP/followup-anchor-venv/bin/python" -m pip install --require-hashes -r requirements-ci.txt
      - name: Verify direct-child data-only anchor and compatibility
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
          PYTHONPATH: src:.
        run: |
          "$RUNNER_TEMP/followup-anchor-venv/bin/python" scripts/verify_followup_performance_lineage.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --s1 "$S1" \
            --s2 "$S2" \
            --expected-receipt-sha256 "$COMPATIBILITY"
          "$RUNNER_TEMP/followup-anchor-venv/bin/python" -m pytest -q \
            tests/test_followup_performance_lineage.py
      - name: Package authority-false source-anchor receipt
        id: receipt
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
          PYTHONPATH: src:.
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup-anchor-artifact-parent"
          "$RUNNER_TEMP/followup-anchor-venv/bin/python" scripts/render_followup_performance_control_receipt.py \
            --kind source-anchor \
            --experiment-source-s1-sha "$S1" \
            --evidence-freeze-s2-sha "$S2" \
            --compatibility-receipt-sha256 "$COMPATIBILITY" \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --detail anchor_transition=single-direct-child \
            --detail changed_path=config/followup-performance-registration-anchors.json \
            --detail behavior_sets=byte-identical \
            --detail qualification_authority=absent \
            --output "$RUNNER_TEMP/followup-anchor-receipt.json"
          "$RUNNER_TEMP/followup-anchor-venv/bin/python" scripts/package_followup_performance_control_artifact.py \
            --kind source-anchor \
            --receipt "$RUNNER_TEMP/followup-anchor-receipt.json" \
            --output-directory "$RUNNER_TEMP/followup-anchor-artifact-parent/artifact" \
            > "$RUNNER_TEMP/followup-anchor-package.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup-anchor-package.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-control-source-anchor-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact authority-false source-anchor receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup-anchor-artifact-parent/artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
