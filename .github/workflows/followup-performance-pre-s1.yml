name: Follow-up performance PRE-S1 Linux and OpenFHE validation

on:
  workflow_dispatch:
    inputs:
      expected_s1_git_sha:
        required: true
        type: string
      expected_s2_git_sha:
        required: true
        type: string
      expected_compatibility_receipt_sha256:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: followup-performance-pre-s1-resource-validation
  cancel-in-progress: false

jobs:
  pre-s1-resource-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_JOBS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Validate identities before checkout
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
        run: |
          [[ "$S1" =~ ^[0-9a-f]{40}$ ]]
          [[ "$S2" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMPATIBILITY" =~ ^[0-9a-f]{64}$ ]]
      - name: Check out detached exact S1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_s1_git_sha }}
      - name: Verify S2 dispatch and exact S1 source
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$S2"
          test "$(git rev-parse HEAD)" = "$S1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Build hash-locked validation environments
        run: |
          python -m venv "$RUNNER_TEMP/followup-pre-s1-venv"
          "$RUNNER_TEMP/followup-pre-s1-venv/bin/python" -m pip install --require-hashes -r requirements-ci.txt
          "$RUNNER_TEMP/followup-pre-s1-venv/bin/python" -m pip install --require-hashes -r requirements-publication.txt
      - name: Verify exact follow-up S1/S2 compatibility
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
          PYTHONPATH: src:.
        run: |
          "$RUNNER_TEMP/followup-pre-s1-venv/bin/python" scripts/verify_followup_performance_lineage.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --s1 "$S1" \
            --s2 "$S2" \
            --expected-receipt-sha256 "$COMPATIBILITY"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      - name: Build pinned OpenFHE and the exact full-query runner
        run: |
          scripts/bootstrap_openfhe.sh
          scripts/build_cpp.sh
      - name: Execute and independently verify ordinary and strong OpenFHE smokes
        env:
          PYTHONPATH: src:.
        run: >-
          "$RUNNER_TEMP/followup-pre-s1-venv/bin/python"
          scripts/run_openfhe_query_smoke.py
          --runner build/cpp/openfhe_query_runner
          --scratch-dir "$RUNNER_TEMP/followup-openfhe-smoke"
      - name: Validate the follow-up scientific and outer contracts with sentinel seeds only
        env:
          PYTHONPATH: src:.
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          "$RUNNER_TEMP/followup-pre-s1-venv/bin/python" -m pytest -q \
            tests/test_followup_performance_contract.py \
            tests/test_followup_performance_control_artifacts.py \
            tests/test_followup_performance_artifacts.py \
            tests/test_followup_performance_lineage.py \
            tests/test_route_a_scientific_profile.py \
            tests/test_run_followup_performance_native_qualification.py \
            tests/test_run_followup_performance_late_qualification.py \
            tests/test_route_a_native_case.py \
            tests/test_route_a_native_guard.py \
            tests/test_route_a_native_suite.py \
            tests/test_route_a_qualification_guard.py \
            tests/test_route_a_postrun_admission.py
          "$RUNNER_TEMP/followup-pre-s1-venv/bin/python" -m ruff check \
            src/dynamic_cssc/followup_performance_artifacts.py \
            src/dynamic_cssc/followup_performance_contract.py \
            src/dynamic_cssc/followup_performance_control_artifacts.py \
            src/dynamic_cssc/followup_performance_lineage.py \
            src/dynamic_cssc/route_a_scientific_profile.py \
            scripts/run_followup_performance_qualification.py \
            scripts/run_followup_performance_native_qualification.py \
            scripts/run_followup_performance_combined_guard.py \
            scripts/run_followup_performance_postrun_admission.py
          git diff --check
      - name: Package authority-false PRE-S1 receipt
        id: receipt
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}
          PYTHONPATH: src:.
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup-pre-s1-artifact-parent"
          "$RUNNER_TEMP/followup-pre-s1-venv/bin/python" scripts/render_followup_performance_control_receipt.py \
            --kind pre-s1 \
            --experiment-source-s1-sha "$S1" \
            --evidence-freeze-s2-sha "$S2" \
            --compatibility-receipt-sha256 "$COMPATIBILITY" \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --detail followup_contract_tests=success \
            --detail openfhe_ordinary_and_strong_smokes=success \
            --detail pinned_openfhe_build=success \
            --detail publication_authority=absent \
            --output "$RUNNER_TEMP/followup-pre-s1-receipt.json"
          "$RUNNER_TEMP/followup-pre-s1-venv/bin/python" scripts/package_followup_performance_control_artifact.py \
            --kind pre-s1 \
            --receipt "$RUNNER_TEMP/followup-pre-s1-receipt.json" \
            --output-directory "$RUNNER_TEMP/followup-pre-s1-artifact-parent/artifact" \
            > "$RUNNER_TEMP/followup-pre-s1-package.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup-pre-s1-package.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-control-pre-s1-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact authority-false PRE-S1 receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup-pre-s1-artifact-parent/artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
