name: CI and R0 freeze pack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: P-1 manifest gate
        run: python scripts/validate_manifest.py config/params_manifest.json
      - name: Python syntax check
        run: python -m compileall -q src scripts tests
      - name: Unit tests
        run: pytest -q --junitxml=results/ci-junit.xml
      - name: Predicted-only smoke model
        run: >-
          python -m dynamic_cssc.cli smoke
          --output-dir results/ci-smoke
          --seed 20260821
          --workload zipf
      - name: Create R0 audit bundle
        run: >-
          python scripts/package_review_bundle.py
          --stage R0
          --output-dir artifacts
          --include results/ci-smoke
          --include results/ci-junit.xml
      - name: Upload R0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-freeze-${{ github.sha }}
          include-hidden-files: true
          path: |
            artifacts/
            results/ci-smoke/
            results/ci-junit.xml
          if-no-files-found: error
          retention-days: 30
