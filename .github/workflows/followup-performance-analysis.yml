name: Follow-up performance isolated descriptive analysis

on:
  workflow_dispatch:
    inputs:
      expected_s1_git_sha:
        required: true
        type: string
      expected_s2_git_sha:
        required: true
        type: string
      expected_s3_git_sha:
        required: true
        type: string
      expected_registration_compatibility_receipt_sha256:
        required: true
        type: string
      expected_analysis_compatibility_receipt_sha256:
        required: true
        type: string
      expected_campaign_id:
        required: true
        type: string
      expected_analysis_claim_oid:
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: followup-performance-analysis-${{ inputs.expected_campaign_id }}
  cancel-in-progress: false

jobs:
  analysis:
    name: isolated-descriptive-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact S3 for provider admission
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_s3_git_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify analysis claim and externally armed watcher
        id: admission
        uses: ./.github/actions/followup-analysis-run-admission
        with:
          expected-claim-oid: ${{ inputs.expected_analysis_claim_oid }}
          expected-campaign-id: ${{ inputs.expected_campaign_id }}
          expected-s1: ${{ inputs.expected_s1_git_sha }}
          expected-s2: ${{ inputs.expected_s2_git_sha }}
          expected-s3: ${{ inputs.expected_s3_git_sha }}
          expected-registration-compatibility: ${{ inputs.expected_registration_compatibility_receipt_sha256 }}
          expected-analysis-compatibility: ${{ inputs.expected_analysis_compatibility_receipt_sha256 }}

      - name: Verify exact detached S3 and closed identities
        env:
          EXPECTED_S1: ${{ inputs.expected_s1_git_sha }}
          EXPECTED_S2: ${{ inputs.expected_s2_git_sha }}
          EXPECTED_S3: ${{ inputs.expected_s3_git_sha }}
          REGISTRATION_COMPATIBILITY: ${{ inputs.expected_registration_compatibility_receipt_sha256 }}
          ANALYSIS_COMPATIBILITY: ${{ inputs.expected_analysis_compatibility_receipt_sha256 }}
          CAMPAIGN_ID: ${{ inputs.expected_campaign_id }}
          ANALYSIS_LIMIT: ${{ steps.admission.outputs.analysis_runner_seconds_limit }}
          TERMINAL_SECONDS: ${{ steps.admission.outputs.terminal_runner_seconds }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_S1" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_S2" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_S3" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REGISTRATION_COMPATIBILITY" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ANALYSIS_COMPATIBILITY" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CAMPAIGN_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ANALYSIS_LIMIT" =~ ^[1-9][0-9]*$ ]]
          [[ "$TERMINAL_SECONDS" =~ ^[0-9]+$ ]]
          test $((ANALYSIS_LIMIT + TERMINAL_SECONDS)) -eq 1800
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_S3"
          test "$(git rev-parse HEAD)" = "$EXPECTED_S3"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up frozen CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'

      - name: Build hash-locked analysis environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/followup-analysis-venv"
          "$RUNNER_TEMP/followup-analysis-venv/bin/python" -m pip install --require-hashes -r requirements-ci.txt
          "$RUNNER_TEMP/followup-analysis-venv/bin/python" -m pip install --require-hashes -r requirements-publication.txt

      - name: Verify exact empty S3 and analyzer compatibility
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          S3: ${{ inputs.expected_s3_git_sha }}
          REGISTRATION_COMPATIBILITY: ${{ inputs.expected_registration_compatibility_receipt_sha256 }}
          ANALYSIS_COMPATIBILITY: ${{ inputs.expected_analysis_compatibility_receipt_sha256 }}
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/followup-analysis-venv/bin/python" \
            scripts/verify_followup_performance_analysis_lineage.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --s1 "$S1" \
            --s2 "$S2" \
            --s3 "$S3" \
            --expected-registration-receipt-sha256 "$REGISTRATION_COMPATIBILITY" \
            --expected-analysis-receipt-sha256 "$ANALYSIS_COMPATIBILITY"

      - name: Install exact campaign, formal, terminal, and aggregate inputs
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/followup-analysis"
          "$RUNNER_TEMP/followup-analysis-venv/bin/python" \
            scripts/prepare_followup_performance_analysis_inputs.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --campaign-transport "${{ steps.admission.outputs.campaign_transport_path }}" \
            --campaign-transport-sha256 "${{ steps.admission.outputs.campaign_transport_sha256 }}" \
            --campaign-transport-member-count "${{ steps.admission.outputs.campaign_transport_member_count }}" \
            --campaign-transport-expanded-bytes "${{ steps.admission.outputs.campaign_transport_expanded_bytes }}" \
            --campaign-evidence-output "$RUNNER_TEMP/followup-analysis/campaign" \
            --formal-artifact-output "$RUNNER_TEMP/followup-analysis/finals" \
            --terminal-artifact-output "$RUNNER_TEMP/followup-analysis/terminal" \
            --terminal-provider-run-id "${{ steps.admission.outputs.terminal_provider_run_id }}" \
            --terminal-artifact-id "${{ steps.admission.outputs.terminal_artifact_id }}" \
            --terminal-artifact-name "${{ steps.admission.outputs.terminal_artifact_name }}" \
            --terminal-artifact-provider-digest "${{ steps.admission.outputs.terminal_artifact_provider_digest }}" \
            --terminal-artifact-size "${{ steps.admission.outputs.terminal_artifact_size_in_bytes }}" \
            --aggregate-artifact-id "${{ steps.admission.outputs.aggregate_artifact_id }}" \
            --aggregate-artifact-name "${{ steps.admission.outputs.aggregate_artifact_name }}" \
            --aggregate-artifact-provider-digest "${{ steps.admission.outputs.aggregate_artifact_provider_digest }}" \
            --aggregate-artifact-size "${{ steps.admission.outputs.aggregate_artifact_size_in_bytes }}" \
            > "$RUNNER_TEMP/followup-analysis/input-receipt.json"

      - name: Reinspect evidence and produce bounded descriptive analysis
        id: analysis
        env:
          S1: ${{ inputs.expected_s1_git_sha }}
          S2: ${{ inputs.expected_s2_git_sha }}
          S3: ${{ inputs.expected_s3_git_sha }}
          REGISTRATION_COMPATIBILITY: ${{ inputs.expected_registration_compatibility_receipt_sha256 }}
          ANALYSIS_COMPATIBILITY: ${{ inputs.expected_analysis_compatibility_receipt_sha256 }}
          ANALYSIS_LIMIT: ${{ steps.admission.outputs.analysis_runner_seconds_limit }}
          TERMINAL_RUN_ID: ${{ steps.admission.outputs.terminal_provider_run_id }}
          TERMINAL_ARTIFACT_NAME: ${{ steps.admission.outputs.terminal_artifact_name }}
          AGGREGATE_ARTIFACT_NAME: ${{ steps.admission.outputs.aggregate_artifact_name }}
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/followup-analysis/output"
          timeout --signal=TERM --kill-after=10s "${ANALYSIS_LIMIT}s" \
            "$RUNNER_TEMP/followup-analysis-venv/bin/python" \
            scripts/run_followup_performance_analysis.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --experiment-source-sha "$S1" \
            --evidence-freeze-sha "$S2" \
            --analysis-source-sha "$S3" \
            --registration-compatibility-receipt-sha256 "$REGISTRATION_COMPATIBILITY" \
            --analysis-compatibility-receipt-sha256 "$ANALYSIS_COMPATIBILITY" \
            --terminal-provider-run-id "$TERMINAL_RUN_ID" \
            --terminal-provider-run-attempt 1 \
            --campaign-evidence-root "$RUNNER_TEMP/followup-analysis/campaign" \
            --formal-artifact-root "$RUNNER_TEMP/followup-analysis/finals" \
            --terminal-artifact-directory "$RUNNER_TEMP/followup-analysis/terminal/$TERMINAL_ARTIFACT_NAME" \
            --aggregate-artifact-directory "$RUNNER_TEMP/followup-analysis/terminal/$AGGREGATE_ARTIFACT_NAME" \
            --output-directory "$RUNNER_TEMP/followup-analysis/output/artifact" \
            > "$RUNNER_TEMP/followup-analysis/output/receipt.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup-analysis/output/receipt.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-analysis-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          jq -c \
            '. + {schema_version:"dynamic-cssc-followup-performance-analysis-phase-receipt-v1"}' \
            "$RUNNER_TEMP/followup-analysis/output/receipt.json" \
            | sed 's/^/FOLLOWUP_ANALYSIS_PHASE_RECEIPT_V1=/'

      - name: Upload bounded descriptive analysis only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.analysis.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup-analysis/output/artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
