name: Follow-up performance one-shot non-admissible qualification

on:
  workflow_dispatch:
    inputs:
      expected_s1_git_sha:
        description: Exact reviewed follow-up experiment-source S1 commit
        required: true
        type: string
      expected_s2_git_sha:
        description: Exact terminal data-only follow-up S2 commit on main
        required: true
        type: string
      expected_compatibility_receipt_sha256:
        description: Exact follow-up S1-to-S2 compatibility receipt SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: followup-performance-one-shot-non-admissible-qualification
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  FOLLOWUP_EXPECTED_S1: ${{ inputs.expected_s1_git_sha }}
  FOLLOWUP_EXPECTED_S2: ${{ inputs.expected_s2_git_sha }}
  FOLLOWUP_EXPECTED_COMPATIBILITY: ${{ inputs.expected_compatibility_receipt_sha256 }}

jobs:
  q1:
    name: qualification-simulator-producer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.run.outputs.artifact_name }}
    steps:
      - &validate-identities
        name: Validate closed dispatch identities before checkout
        run: |
          [[ "$FOLLOWUP_EXPECTED_S1" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FOLLOWUP_EXPECTED_S2" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FOLLOWUP_EXPECTED_COMPATIBILITY" =~ ^[0-9a-f]{64}$ ]]
      - &checkout-s1
        name: Check out detached exact S1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_s1_git_sha }}
      - &verify-dispatch
        name: Verify workflow dispatch and exact S1 checkout
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$FOLLOWUP_EXPECTED_S2"
          test "$(git rev-parse HEAD)" = "$FOLLOWUP_EXPECTED_S1"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - &setup-python
        name: Build hash-locked Python environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - &install-python
        name: Install hash-locked Python dependencies outside S1
        run: |
          python -m venv "$RUNNER_TEMP/followup-venv"
          "$RUNNER_TEMP/followup-venv/bin/python" -m pip install --require-hashes -r requirements-ci.txt
          "$RUNNER_TEMP/followup-venv/bin/python" -m pip install --require-hashes -r requirements-publication.txt
      - &verify-lineage
        name: Verify exact follow-up S1/S2 compatibility
        run: |
          "$RUNNER_TEMP/followup-venv/bin/python" scripts/verify_followup_performance_lineage.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --s1 "$FOLLOWUP_EXPECTED_S1" \
            --s2 "$FOLLOWUP_EXPECTED_S2" \
            --expected-receipt-sha256 "$FOLLOWUP_EXPECTED_COMPATIBILITY"
      - name: Run q1 simulator producer in an owned child
        id: run
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup/q1/scratch"
          install -d -m 700 "$RUNNER_TEMP/followup/q1/out"
          "$RUNNER_TEMP/followup-venv/bin/python" scripts/run_followup_performance_qualification.py run \
            --stage q1 \
            --repository-root "$GITHUB_WORKSPACE" \
            --experiment-source-sha "$FOLLOWUP_EXPECTED_S1" \
            --workflow-head-sha "$FOLLOWUP_EXPECTED_S2" \
            --compatibility-receipt-sha256 "$FOLLOWUP_EXPECTED_COMPATIBILITY" \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --scratch-parent "$RUNNER_TEMP/followup/q1/scratch" \
            --output-directory "$RUNNER_TEMP/followup/q1/out/artifact" \
            > "$RUNNER_TEMP/followup/q1/receipt.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup/q1/receipt.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-qualification-q1-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact q1 outer private handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup/q1/out/artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  q2:
    name: qualification-simulator-independent-replay-and-guard
    needs: q1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.run.outputs.artifact_name }}
    steps:
      - *validate-identities
      - *checkout-s1
      - *verify-dispatch
      - *setup-python
      - *install-python
      - *verify-lineage
      - name: Download exact q1 outer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.q1.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup/q2/q1
      - name: Run q2 independent simulator replay and guard
        id: run
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup/q2/scratch"
          install -d -m 700 "$RUNNER_TEMP/followup/q2/out"
          "$RUNNER_TEMP/followup-venv/bin/python" scripts/run_followup_performance_qualification.py run \
            --stage q2 \
            --repository-root "$GITHUB_WORKSPACE" \
            --experiment-source-sha "$FOLLOWUP_EXPECTED_S1" \
            --workflow-head-sha "$FOLLOWUP_EXPECTED_S2" \
            --compatibility-receipt-sha256 "$FOLLOWUP_EXPECTED_COMPATIBILITY" \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --scratch-parent "$RUNNER_TEMP/followup/q2/scratch" \
            --output-directory "$RUNNER_TEMP/followup/q2/out/artifact" \
            --producer-artifact-directory "$RUNNER_TEMP/followup/q2/q1" \
            > "$RUNNER_TEMP/followup/q2/receipt.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup/q2/receipt.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-qualification-q2-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact q2 outer guarded result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup/q2/out/artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  q3:
    name: qualification-native-case-shaped-producer
    needs: q2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_JOBS: '2'
      OMP_NUM_THREADS: '2'
    outputs:
      artifact_name: ${{ steps.run.outputs.artifact_name }}
    steps:
      - *validate-identities
      - *checkout-s1
      - *verify-dispatch
      - *setup-python
      - name: Install Python and native build dependencies
        run: |
          python -m venv "$RUNNER_TEMP/followup-venv"
          "$RUNNER_TEMP/followup-venv/bin/python" -m pip install --require-hashes -r requirements-ci.txt
          "$RUNNER_TEMP/followup-venv/bin/python" -m pip install --require-hashes -r requirements-publication.txt
          sudo apt-get update
          sudo apt-get install -y ninja-build libomp-dev
      - *verify-lineage
      - name: Build pinned OpenFHE and the exact query runner
        run: |
          scripts/bootstrap_openfhe.sh
          scripts/build_cpp.sh
      - name: Run one discarded warm-up and three fresh-key native producers
        id: run
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup/q3/scratch"
          install -d -m 700 "$RUNNER_TEMP/followup/q3/out"
          "$RUNNER_TEMP/followup-venv/bin/python" scripts/run_followup_performance_native_qualification.py \
            --stage q3 \
            --repository-root "$GITHUB_WORKSPACE" \
            --experiment-source-sha "$FOLLOWUP_EXPECTED_S1" \
            --workflow-head-sha "$FOLLOWUP_EXPECTED_S2" \
            --compatibility-receipt-sha256 "$FOLLOWUP_EXPECTED_COMPATIBILITY" \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --scratch-parent "$RUNNER_TEMP/followup/q3/scratch" \
            --output-directory "$RUNNER_TEMP/followup/q3/out/artifact" \
            > "$RUNNER_TEMP/followup/q3/receipt.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup/q3/receipt.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-qualification-q3-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact q3 outer build and retained packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup/q3/out/artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  q4:
    name: qualification-native-independent-replay-and-guard
    needs: q3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
    outputs:
      artifact_name: ${{ steps.run.outputs.artifact_name }}
    steps:
      - *validate-identities
      - *checkout-s1
      - *verify-dispatch
      - *setup-python
      - *install-python
      - *verify-lineage
      - name: Download exact q3 outer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.q3.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup/q4/q3
      - name: Replay all three exact packages and guard the native case
        id: run
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup/q4/scratch"
          install -d -m 700 "$RUNNER_TEMP/followup/q4/out"
          "$RUNNER_TEMP/followup-venv/bin/python" scripts/run_followup_performance_native_qualification.py \
            --stage q4 \
            --repository-root "$GITHUB_WORKSPACE" \
            --experiment-source-sha "$FOLLOWUP_EXPECTED_S1" \
            --workflow-head-sha "$FOLLOWUP_EXPECTED_S2" \
            --compatibility-receipt-sha256 "$FOLLOWUP_EXPECTED_COMPATIBILITY" \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --scratch-parent "$RUNNER_TEMP/followup/q4/scratch" \
            --output-directory "$RUNNER_TEMP/followup/q4/out/artifact" \
            --q3-artifact-directory "$RUNNER_TEMP/followup/q4/q3" \
            > "$RUNNER_TEMP/followup/q4/receipt.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup/q4/receipt.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-qualification-q4-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact q4 outer native guarded result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup/q4/out/artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  q5:
    name: qualification-combined-guard
    needs: [q2, q4]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.run.outputs.artifact_name }}
    steps:
      - *validate-identities
      - *checkout-s1
      - *verify-dispatch
      - *setup-python
      - *install-python
      - *verify-lineage
      - name: Read exact q2/q4 provider metadata and wrapper bytes
        env:
          GH_TOKEN: ${{ github.token }}
          Q2_NAME: ${{ needs.q2.outputs.artifact_name }}
          Q4_NAME: ${{ needs.q4.outputs.artifact_name }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup/q5/provider"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/followup/q5/provider/artifacts.json"
          Q2_ID="$(jq -er --arg name "$Q2_NAME" '.artifacts | map(select(.name == $name)) | if length == 1 then .[0].id else error("q2 identity") end' "$RUNNER_TEMP/followup/q5/provider/artifacts.json")"
          Q4_ID="$(jq -er --arg name "$Q4_NAME" '.artifacts | map(select(.name == $name)) | if length == 1 then .[0].id else error("q4 identity") end' "$RUNNER_TEMP/followup/q5/provider/artifacts.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$Q2_ID/zip" \
            > "$RUNNER_TEMP/followup/q5/provider/q2.zip"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$Q4_ID/zip" \
            > "$RUNNER_TEMP/followup/q5/provider/q4.zip"
      - name: Run q5 combined functional and structural guard
        id: run
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup/q5/scratch"
          install -d -m 700 "$RUNNER_TEMP/followup/q5/out"
          "$RUNNER_TEMP/followup-venv/bin/python" scripts/run_followup_performance_combined_guard.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --experiment-source-sha "$FOLLOWUP_EXPECTED_S1" \
            --workflow-head-sha "$FOLLOWUP_EXPECTED_S2" \
            --compatibility-receipt-sha256 "$FOLLOWUP_EXPECTED_COMPATIBILITY" \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --provider-artifacts-json "$RUNNER_TEMP/followup/q5/provider/artifacts.json" \
            --q2-wrapper "$RUNNER_TEMP/followup/q5/provider/q2.zip" \
            --q4-wrapper "$RUNNER_TEMP/followup/q5/provider/q4.zip" \
            --scratch-parent "$RUNNER_TEMP/followup/q5/scratch" \
            --output-directory "$RUNNER_TEMP/followup/q5/out/artifact" \
            > "$RUNNER_TEMP/followup/q5/receipt.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup/q5/receipt.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-qualification-q5-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact q5 outer combined guard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup/q5/out/artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  q6:
    name: qualification-postrun-resource-admission
    needs: q5
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_name: ${{ steps.run.outputs.artifact_name }}
    steps:
      - *validate-identities
      - *checkout-s1
      - *verify-dispatch
      - *setup-python
      - *install-python
      - *verify-lineage
      - name: Read final q1-q5 and live q6 provider state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup/q6/provider"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/followup/q6/provider/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > "$RUNNER_TEMP/followup/q6/provider/jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/followup/q6/provider/artifacts.json"
      - name: Produce authority-false q6 postrun record
        id: run
        run: |
          install -d -m 700 "$RUNNER_TEMP/followup/q6/out"
          "$RUNNER_TEMP/followup-venv/bin/python" scripts/run_followup_performance_postrun_admission.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --experiment-source-sha "$FOLLOWUP_EXPECTED_S1" \
            --workflow-head-sha "$FOLLOWUP_EXPECTED_S2" \
            --compatibility-receipt-sha256 "$FOLLOWUP_EXPECTED_COMPATIBILITY" \
            --expected-head-branch main \
            --provider-run-id "$GITHUB_RUN_ID" \
            --provider-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-json "$RUNNER_TEMP/followup/q6/provider/run.json" \
            --jobs-json "$RUNNER_TEMP/followup/q6/provider/jobs.json" \
            --artifacts-json "$RUNNER_TEMP/followup/q6/provider/artifacts.json" \
            --output-directory "$RUNNER_TEMP/followup/q6/out/artifact" \
            > "$RUNNER_TEMP/followup/q6/receipt.json"
          ARTIFACT_NAME="$(jq -er .artifact_name "$RUNNER_TEMP/followup/q6/receipt.json")"
          [[ "$ARTIFACT_NAME" =~ ^followup-performance-v1-qualification-q6-[a-z0-9-]+$ ]]
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact q6 outer postrun admission record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: ${{ runner.temp }}/followup/q6/out/artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
